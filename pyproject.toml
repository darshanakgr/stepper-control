[project]
name = "stepper-control"
version = "0.1.0"
description = "Desktop serial controller for an Arduino STEP/DIR motor driver"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
stepper-control = "stepper_control.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
